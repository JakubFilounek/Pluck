<!-- Boutique site with no structured product data at all, only OpenGraph tags added
     for social sharing. The title carries the usual "| Shop" suffix that should be
     stripped, and the price comes from product:price meta. -->
<html lang="en">
  <head>
    <title>Leather Sketchbook Cover | Maker Studio</title>
    <meta property="og:title" content="Leather Sketchbook Cover | Maker Studio" />
    <meta property="og:image" content="https://cdn.makerstudio.com/covers/leather-a5.jpg" />
    <meta property="og:description" content="Hand-stitched full grain leather, A5." />
    <meta property="product:price:amount" content="52.00" />
    <meta property="product:price:currency" content="EUR" />
    <meta property="product:brand" content="Maker Studio" />
    <meta name="twitter:title" content="Leather Sketchbook Cover" />
    <meta name="twitter:image" content="https://cdn.makerstudio.com/covers/leather-a5-square.jpg" />
  </head>
  <body>
    <h1>Leather Sketchbook Cover</h1>
  </body>
</html>
