<!-- Older shop platform: schema.org microdata via itemprop attributes, no JSON-LD.
     Price is split across content attributes rather than text. -->
<html lang="en">
  <head>
    <title>Wool Throw Blanket – Nordic Home</title>
  </head>
  <body>
    <div itemscope itemtype="http://schema.org/Product">
      <h1 itemprop="name">Merino Wool Throw Blanket</h1>
      <img itemprop="image" src="/media/products/throw-blanket-large.jpg" alt="Wool throw" />
      <span itemprop="brand">Nordic Home</span>
      <p itemprop="description">Soft merino throw, 130 x 180 cm, oatmeal.</p>
      <div itemprop="offers" itemscope itemtype="http://schema.org/Offer">
        <meta itemprop="price" content="2490.00" />
        <meta itemprop="priceCurrency" content="CZK" />
        <link itemprop="availability" href="http://schema.org/OutOfStock" />
        <span class="price">2 490 Kč</span>
      </div>
    </div>
  </body>
</html>
